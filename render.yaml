services:
  - type: web
    name: weather-ai-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_ARTIFACT_DIR
        value: ./artifacts
      - key: ALLOWED_ORIGINS
        value: "*"
